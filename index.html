<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BI Estúdio · Benfica Independente</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-512.png">
<link rel="preload" href="fontes/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css?v=10">
</head>
<body>

<!-- Ecrã de entrada -->
<section id="ecra-entrar" class="entrar">
  <div class="entrar-caixa">
    <img src="icone-512.png" alt="" class="entrar-logo">
    <h1>BI Estúdio</h1>
    <p class="suave">A plataforma de quem faz o Benfica Independente</p>

    <button id="entrar-google" class="botao principal largo">Entrar com a conta Google</button>
    <p class="separador-ou"><span>ou com email e palavra-passe</span></p>
    <label>Email
      <input id="entrar-email" type="email" placeholder="o-teu-email@exemplo.com" autocomplete="username">
    </label>
    <label>Palavra-passe
      <input id="entrar-palavra" type="password" autocomplete="current-password">
    </label>
    <button id="entrar-email-botao" class="botao largo">Entrar</button>
    <p class="entrar-links">
      <a href="#" id="entrar-primeiro" onclick="return false">Primeiro acesso</a>
      <a href="#" id="entrar-esqueci" onclick="return false">Esqueci-me da palavra-passe</a>
    </p>
    <button id="entrar-local" class="botao largo fantasma">Experimentar sem internet (nada chega à app)</button>

    <p class="entrar-rodape">
      <a href="privacidade.html">Privacidade</a>
      <button type="button" id="entrar-emergencia" class="ligacao">Acesso de emergência (dono)</button>
    </p>
    <div id="caixa-emergencia" class="escondido">
      <label>Chave de acesso (GitHub)
        <input id="entrar-token" type="password" placeholder="github_pat_..." autocomplete="off">
      </label>
      <button id="entrar-botao" class="botao largo">Entrar com a chave</button>
    </div>

    <p id="entrar-erro" class="erro"></p>
  </div>
</section>

<!-- Aplicação -->
<div id="app" class="app escondido">
  <aside class="barra">
    <div class="barra-topo">
      <img src="icone-192.png" alt="" class="barra-logo">
      <div>
        <strong>BI Estúdio</strong>
        <span id="barra-modo" class="etiqueta"></span>
      </div>
    </div>
    <nav id="menu" class="menu"></nav>
    <div class="barra-fundo">
      <span id="quem" class="quem"></span>
      <button id="sair" class="botao pequeno fantasma">Sair</button>
    </div>
  </aside>

  <main class="conteudo">
    <header class="topo">
      <img src="icone-192.png" alt="" class="topo-logo so-telemovel">
      <h2 id="titulo-ecra">Direto</h2>
      <button id="aprovacoes" class="aviso-aprovacoes escondido"></button>
      <button id="sair-m" class="botao pequeno fantasma so-telemovel">Sair</button>
    </header>
    <div id="fase-testes" class="fase-testes escondido" role="status">⚠ Fase de testes: basta 1 aprovação. O que gravares fica logo publicado, sem ninguém rever.</div>
    <nav id="subnav" class="subnav escondido"></nav>
    <div id="aviso" class="aviso escondido"></div>
    <div id="ecra" class="ecra"></div>
  </main>

  <nav id="menu-baixo" class="menu-baixo"></nav>
  <button id="ajuda-flutuante" class="ajuda-fab" aria-label="Pedir ajuda à IA"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><span>Ajuda</span></button>
</div>

<div id="carregando" class="carregando escondido"><div class="roda"></div></div>

<script src="quadro.js?v=23"></script>
<script src="participacao.js?v=6"></script>
<script src="participantes.js?v=7"></script>
<script src="app.js?v=12"></script>
<script src="estilo.js?v=1"></script>
</body>
</html>
